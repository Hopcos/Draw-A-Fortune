<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9fb"/>
      <stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f3"/>
    </linearGradient>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c2230" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1c2230" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 简化 DSH 界面（仅示意底色） -->
  <rect width="480" height="360" rx="10" fill="url(#bg)"/>
  <rect x="0" y="0" width="130" height="360" fill="#e4e7ec"/>
  <rect x="148" y="22" width="250" height="14" rx="7" fill="#dfe3e9"/>
  <rect x="148" y="58" width="190" height="12" rx="6" fill="#e8ebf0"/>
  <rect x="148" y="86" width="220" height="12" rx="6" fill="#e8ebf0"/>
  <rect x="148" y="114" width="160" height="12" rx="6" fill="#e8ebf0"/>
  <rect x="148" y="296" width="312" height="40" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- 右下角收起态浮钮（与真实 CSS 同款：52px 圆钮、径向渐变、阴影、☯） -->
  <g filter="url(#badgeShadow)">
    <circle cx="436" cy="314" r="26" fill="url(#badge)" stroke="#9aa1a8" stroke-opacity="0.55" stroke-width="1"/>
  </g>
  <text x="436" y="322" text-anchor="middle" font-size="24" fill="#23272f" font-weight="700">☯</text>

  <!-- 悬浮提示（示意点击起卦） -->
  <rect x="352" y="254" width="138" height="26" rx="13" fill="#2f3641" opacity="0.92"/>
  <text x="421" y="272" text-anchor="middle" font-size="12" fill="#ffffff">点击 ☯ 手动起卦</text>
  <path d="M 416 282 L 410 296 L 426 296 Z" fill="#2f3641" opacity="0.92"/>
</svg>
